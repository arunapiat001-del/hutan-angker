name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Salin three.js
        run: cp node_modules/three/build/three.module.js www/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Paksa landscape
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for U in https://mirrors.cloud.tencent.com/gradle https://repo.huaweicloud.com/gradle https://services.gradle.org/distributions; do
            sed -i "s|^distributionUrl=.*|distributionUrl=$U/gradle-8.2.1-bin.zip|" gradle/wrapper/gradle-wrapper.properties
            ./gradlew assembleDebug && exit 0
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: hutan-angker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
